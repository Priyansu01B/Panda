<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website fit properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panda 🐼</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: 'Nunito', sans-serif;

            /* PANDA BACKGROUND */
            background-image:
                linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
                url("panda.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        /* Main screen container */

        .screen {
            display: none;

            width: 100%;
            max-width: 500px;

            padding: 25px;

            text-align: center;

            animation: screenIn 0.5s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes screenIn {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Title */

        .bouncy-title {
            font-family: 'Fredoka', sans-serif;

            font-size: clamp(2rem, 8vw, 2.8rem);

            line-height: 1.2;

            text-align: center;

            color: white;

            text-shadow:
                3px 3px 0 #000,
                -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000;

            animation: bounceText 2s infinite alternate ease-in-out;

            margin-bottom: 25px;
        }

        @keyframes bounceText {

            from {
                transform: translateY(0) rotate(-1deg);
            }

            to {
                transform: translateY(-8px) rotate(1deg);
            }
        }

        /* Buttons */

        .button-container {
            display: flex;
            justify-content: center;
            gap: 12px;

            width: 100%;
        }

        .cute-btn {

            font-family: 'Fredoka', sans-serif;

            font-size: 1.2rem;

            padding: 12px 25px;

            border-radius: 50px;

            border: 4px solid white;

            cursor: pointer;

            font-weight: 600;

            min-width: 120px;

            box-shadow:
                0 8px 15px rgba(0,0,0,0.25);

            transition: 0.2s ease;
        }

        .cute-btn:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .cute-btn:active {
            transform: scale(0.95);
        }

        .btn-yes {
            background: #ff9ff3;
            color: #833471;
        }

        .btn-no {
            background: #48dbfb;
            color: #075985;
        }

        /* QR Code */

        .qr-image {

            width: min(250px, 75vw);

            border-radius: 24px;

            border: 6px dashed white;

            padding: 10px;

            background: rgba(255,255,255,0.85);

            box-shadow:
                0 15px 30px rgba(0,0,0,0.3);

            animation: popIn 0.6s ease;
        }

        @keyframes popIn {

            from {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        /* Small buttons */

        .restart-link {

            margin-top: 25px;

            color: white;

            text-decoration: none;

            font-weight: bold;

            background: rgba(0,0,0,0.55);

            padding: 10px 18px;

            border-radius: 25px;

            border: 2px solid white;

            cursor: pointer;

            font-family: 'Nunito', sans-serif;
        }

        .restart-link:hover {
            background: rgba(0,0,0,0.75);
        }

        /* Mobile */

        @media (max-width: 480px) {

            .screen {
                padding: 20px;
            }

            .bouncy-title {
                font-size: 2rem;
            }

            .cute-btn {
                min-width: 110px;
                padding: 10px 20px;
            }
        }

    </style>
</head>

<body>

    <!-- ========================= -->
    <!-- FIRST SCREEN -->
    <!-- ========================= -->

    <div id="screen-main" class="screen active">

        <h1 class="bouncy-title">
            Tui mam er kach theke taka peyechis 🐼
        </h1>

        <div class="button-container">

            <button
                class="cute-btn btn-yes"
                onclick="showScreen('screen-yes-main')">

                Yes

            </button>

            <button
                class="cute-btn btn-no"
                onclick="showScreen('screen-barabari')">

                No

            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- YES SCREEN -->
    <!-- ========================= -->

    <div id="screen-yes-main" class="screen">

        <h2 class="bouncy-title">
            Pay Up! ✨
        </h2>

        <img
            src="1000188952.png"
            alt="QR Code"
            class="qr-image">

        <button
            class="restart-link"
            onclick="showScreen('screen-main')">

            Start Over

        </button>

    </div>


    <!-- ========================= -->
    <!-- BARABARI SCREEN -->
    <!-- ========================= -->

    <div id="screen-barabari" class="screen">

        <h1 class="bouncy-title">
            Barabari hoyche 🤨
        </h1>

        <div class="button-container">

            <button
                class="cute-btn"
                style="background:#55efc4;color:#00b894;"
                onclick="showScreen('screen-yes-barabari')">

                Yes

            </button>

            <button
                class="cute-btn"
                style="background:#ffeaa7;color:#fdcb6e;"
                onclick="showScreen('screen-smile')">

                No

            </button>

        </div>

    </div>


    <!-- ========================= -->
    <!-- BARABARI YES SCREEN -->
    <!-- ========================= -->

    <div id="screen-yes-barabari" class="screen">

        <h2 class="bouncy-title">
            Ahem! Taka de! 💸
        </h2>

        <img
            src="1000188952.png"
            alt="QR Code"
            class="qr-image">

        <button
            class="restart-link"
            onclick="showScreen('screen-main')">

            Start Over

        </button>

    </div>


    <!-- ========================= -->
    <!-- SMILE SCREEN -->
    <!-- ========================= -->

    <div id="screen-smile" class="screen">

        <h1 class="bouncy-title">
            Tor smile a<br>
            paid hoyegache ❤️
        </h1>

        <button
            class="restart-link"
            onclick="showScreen('screen-main')">

            Play Again

        </button>

    </div>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        function showScreen(screenId) {

            const screens =
                document.querySelectorAll('.screen');

            screens.forEach(function(screen) {

                screen.classList.remove('active');

            });

            setTimeout(function() {

                const targetScreen =
                    document.getElementById(screenId);

                if (targetScreen) {

                    targetScreen.classList.add('active');

                }

            }, 50);

        }

    </script>

</body>
</html>
