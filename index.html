<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panda Money 🐼💸</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap"
          rel="stylesheet">


    <style>

        /* =====================================
           BASIC RESET
        ===================================== */

        * {
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family: 'Nunito', sans-serif;

            /* Colourful gradient */

            background:
                linear-gradient(
                    135deg,
                    #ff9ff3,
                    #a29bfe,
                    #74b9ff,
                    #81ecec,
                    #55efc4,
                    #ffeaa7,
                    #ff7675,
                    #fd79a8
                );

            background-size: 500% 500%;

            animation:
                gradientMove
                15s
                ease
                infinite;

            position: relative;

            overflow-x: hidden;

            overflow-y: auto;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 20px 0;

        }


        /* =====================================
           ANIMATED GRADIENT
        ===================================== */

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 50% 100%;
            }

            50% {
                background-position: 100% 50%;
            }

            75% {
                background-position: 50% 0%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =====================================
           FLOATING EMOJIS
        ===================================== */

        .emoji {

            position: fixed;

            pointer-events: none;

            user-select: none;

            z-index: 0;

            opacity: 0.65;

            animation:
                floatEmoji
                linear
                infinite;

        }


        @keyframes floatEmoji {

            0% {

                transform:
                    translateY(110vh)
                    rotate(0deg);

                opacity: 0;

            }

            10% {
                opacity: 0.7;
            }

            50% {

                transform:
                    translateY(50vh)
                    rotate(180deg);

            }

            90% {
                opacity: 0.7;
            }

            100% {

                transform:
                    translateY(-15vh)
                    rotate(360deg);

                opacity: 0;

            }

        }


        /* =====================================
           SCREEN
        ===================================== */

        .screen {

            display: none;

            width: 100%;

            max-width: 520px;

            padding:
                30px
                20px
                50px;

            text-align: center;

            position: relative;

            z-index: 5;

            animation:
                screenIn
                0.5s
                ease;

        }


        .screen.active {

            display: flex;

            flex-direction: column;

            align-items: center;

        }


        @keyframes screenIn {

            from {

                opacity: 0;

                transform:
                    scale(0.85)
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }


        /* =====================================
           GLASS CARD
        ===================================== */

        .card {

            width: 100%;

            padding: 30px 20px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.30);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            border:
                3px solid
                rgba(255,255,255,0.65);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.18);

        }


        /* =====================================
           TITLE
        ===================================== */

        .bouncy-title {

            font-family: 'Fredoka', sans-serif;

            font-size:
                clamp(
                    2rem,
                    9vw,
                    3rem
                );

            line-height: 1.15;

            text-align: center;

            color: white;

            margin:
                0 0 25px 0;

            text-shadow:

                3px 3px 0 #833471,

                -1px -1px 0
                rgba(255,255,255,0.8),

                0 5px 15px
                rgba(0,0,0,0.25);

            animation:
                titleBounce
                2s
                ease-in-out
                infinite
                alternate;

        }


        @keyframes titleBounce {

            from {

                transform:
                    translateY(0)
                    rotate(-1deg);

            }

            to {

                transform:
                    translateY(-8px)
                    rotate(1deg);

            }

        }


        /* =====================================
           BUTTONS
        ===================================== */

        .button-container {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            width: 100%;

        }


        .cute-btn {

            font-family:
                'Fredoka',
                sans-serif;

            font-size: 1.25rem;

            padding:
                13px 28px;

            border-radius: 50px;

            border:
                4px solid white;

            cursor: pointer;

            font-weight: 600;

            min-width: 125px;

            box-shadow:
                0 10px 20px
                rgba(0,0,0,0.20);

            transition:
                0.2s ease;

        }


        .cute-btn:hover {

            transform:
                translateY(-6px)
                scale(1.06);

            box-shadow:
                0 15px 25px
                rgba(0,0,0,0.25);

        }


        .cute-btn:active {

            transform:
                scale(0.94);

        }


        .btn-yes {

            background: #ff9ff3;

            color: #833471;

        }


        .btn-no {

            background: #48dbfb;

            color: #075985;

        }


        /* =====================================
           IMAGES
        ===================================== */

        .pay-image {

            width:
                min(
                    100%,
                    330px
                );

            height: auto;

            max-height: none;

            object-fit: contain;

            border-radius: 22px;

            border:
                5px solid white;

            padding: 5px;

            background:
                rgba(255,255,255,0.85);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.25);

            margin:
                0 auto 25px;

            animation:
                popIn
                0.7s
                ease;

            display: block;

        }


        .qr-image {

            width:
                min(
                    280px,
                    80vw
                );

            height: auto;

            border-radius: 25px;

            border:
                6px dashed white;

            padding: 10px;

            background:
                rgba(255,255,255,0.95);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.30);

            animation:
                popIn
                0.8s
                ease;

            display: block;

            margin:
                0 auto 20px;

        }


        @keyframes popIn {

            from {

                opacity: 0;

                transform:
                    scale(0.5)
                    rotate(-8deg);

            }

            to {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);

            }

        }


        /* =====================================
           RESTART BUTTON
        ===================================== */

        .restart-link {

            margin-top: 15px;

            color: white;

            font-weight: 800;

            background:
                rgba(0,0,0,0.45);

            padding:
                11px 20px;

            border-radius: 30px;

            border:
                2px solid white;

            cursor: pointer;

            font-family:
                'Nunito',
                sans-serif;

            font-size: 1rem;

        }


        .restart-link:hover {

            background:
                rgba(0,0,0,0.65);

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 480px) {

            body {

                padding-top: 10px;

            }


            .screen {

                padding:
                    20px
                    12px
                    50px;

            }


            .card {

                padding:
                    25px
                    15px
                    30px;

            }


            .bouncy-title {

                font-size:
                    clamp(
                        1.9rem,
                        9vw,
                        2.5rem
                    );

            }


            .cute-btn {

                min-width: 105px;

                padding:
                    11px
                    20px;

            }


            .pay-image {

                width: 95%;

            }


            .qr-image {

                width: 75vw;

                max-width: 280px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         FLOATING EMOJIS
    ====================================== -->

    <div class="emoji"
         style="left:5%; font-size:35px; animation-duration:12s;">
        🐼
    </div>

    <div class="emoji"
         style="left:15%; font-size:28px; animation-duration:15s; animation-delay:2s;">
        ❤️
    </div>

    <div class="emoji"
         style="left:25%; font-size:32px; animation-duration:11s; animation-delay:5s;">
        😂
    </div>

    <div class="emoji"
         style="left:35%; font-size:30px; animation-duration:17s; animation-delay:1s;">
        🐼
    </div>

    <div class="emoji"
         style="left:45%; font-size:25px; animation-duration:13s; animation-delay:4s;">
        ✨
    </div>

    <div class="emoji"
         style="left:55%; font-size:35px; animation-duration:16s; animation-delay:3s;">
        💕
    </div>

    <div class="emoji"
         style="left:65%; font-size:32px; animation-duration:12s; animation-delay:7s;">
        🐼
    </div>

    <div class="emoji"
         style="left:75%; font-size:30px; animation-duration:14s; animation-delay:2s;">
        🥰
    </div>

    <div class="emoji"
         style="left:85%; font-size:36px; animation-duration:18s; animation-delay:6s;">
        🎀
    </div>

    <div class="emoji"
         style="left:92%; font-size:28px; animation-duration:11s; animation-delay:4s;">
        🌈
    </div>

    <div class="emoji"
         style="left:10%; font-size:25px; animation-duration:19s; animation-delay:8s;">
        💸
    </div>

    <div class="emoji"
         style="left:80%; font-size:32px; animation-duration:15s; animation-delay:9s;">
        😭
    </div>


    <!-- =====================================
         SCREEN 1
    ====================================== -->

    <div
        id="screen-main"
        class="screen active"
    >

        <div class="card">

            <h1 class="bouncy-title">

                Tui mam er kach theke
                taka peyechis 🐼💸

            </h1>


            <div class="button-container">

                <button
                    class="cute-btn btn-yes"
                    onclick="
                        showScreen('screen-yes')
                    "
                >

                    Yes 💸

                </button>


                <button
                    class="cute-btn btn-no"
                    onclick="
                        showScreen('screen-barabari')
                    "
                >

                    No 😭

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================
         YES → PAYMENT QR
    ====================================== -->

    <div
        id="screen-yes"
        class="screen"
    >

        <div class="card">

            <h1 class="bouncy-title">

                Pay Up! 💸🐼

            </h1>


            <img
                src="payment-qr.png"
                alt="Payment QR Code"
                class="qr-image"
            >


            <button
                class="restart-link"
                onclick="
                    showScreen('screen-main')
                "
            >

                🔄 Start Over

            </button>

        </div>

    </div>


    <!-- =====================================
         NO → BARABARI
    ====================================== -->

    <div
        id="screen-barabari"
        class="screen"
    >

        <div class="card">

            <h1 class="bouncy-title">

                Barabari hoyche 🤨🐼

            </h1>


            <div class="button-container">


                <!-- YES -->

                <button
                    class="cute-btn"
                    style="
                        background:#55efc4;
                        color:#00b894;
                    "
                    onclick="
                        showScreen('screen-sorry')
                    "
                >

                    Yes 😭

                </button>


                <!-- NO -->

                <button
                    class="cute-btn"
                    style="
                        background:#ffeaa7;
                        color:#fdcb6e;
                    "
                    onclick="
                        showScreen('screen-smile')
                    "
                >

                    No 😂

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================
         YES → SORRY + PNG + QR
    ====================================== -->

    <div
        id="screen-sorry"
        class="screen"
    >

        <div class="card">

            <h1 class="bouncy-title">

                Sorry 😭🐼

            </h1>


            <!-- FIRST PNG -->

            <img
                src="Sorry.jpg"
                alt="Sorry"
                class="pay-image"
            >


            <!-- PAYMENT QR -->

            <img
                src="payment-qr.png"
                alt="Payment QR Code"
                class="qr-image"
            >


            <button
                class="restart-link"
                onclick="
                    showScreen('screen-main')
                "
            >

                🔄 Play Again 🐼

            </button>

        </div>

    </div>


    <!-- =====================================
         NO → SMILE PAID
    ====================================== -->

    <div
        id="screen-smile"
        class="screen"
    >

        <div class="card">

            <h1 class="bouncy-title">

                Tor smile a
                <br>
                paid hoye gache ❤️🐼

            </h1>


            <div style="
                font-size:60px;
                margin:20px 0;
            ">

                🐼😂❤️✨💕

            </div>


            <button
                class="restart-link"
                onclick="
                    showScreen('screen-main')
                "
            >

                🔄 Play Again 🐼

            </button>

        </div>

    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>

        function showScreen(screenId) {

            const screens =
                document.querySelectorAll(
                    '.screen'
                );


            screens.forEach(
                function(screen) {

                    screen.classList.remove(
                        'active'
                    );

                }
            );


            setTimeout(
                function() {

                    const targetScreen =
                        document.getElementById(
                            screenId
                        );


                    if (targetScreen) {

                        targetScreen.classList.add(
                            'active'
                        );

                    }


                    /* Scroll back to top */

                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });

                },
                50
            );

        }

    </script>


</body>

</html>
